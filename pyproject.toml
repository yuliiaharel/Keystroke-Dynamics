[project]
name = "keystroke-dynamics"
version = "0.1.0"
description = "Keystroke-timing biometric demo, rewritten in Python 3"
authors = [
    { name = "Yuliia (Synytsia) Harel", email = "1986311+yuliiaharel@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
