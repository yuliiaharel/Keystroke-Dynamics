<style>
/* Layout: a party room. Each player's signature ring is the hero; attacks and scores sit around it. */
:root {
  --paper: #edebfa; --sheet: #f9f8ff; --ink: #1e1a4d; --muted: #5d5a86; --line: #cfcbea;
  --accent: #c2185b; --twin: #007c89; --good: #1b7f4b; --bad: #b3261e; --on-accent: #ffffff;
  --p0: #c2185b; --p1: #007c89; --p2: #6a3fc9; --p3: #b35c00; --p4: #1b7f4b; --p5: #1f5fbf;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #15132f; --sheet: #201d45; --ink: #efedff; --muted: #a9a6d0; --line: #3a3668;
  --accent: #ff77a8; --twin: #48d1dc; --good: #5bd68f; --bad: #ff8a80; --on-accent: #23102a;
  --p0: #ff77a8; --p1: #48d1dc; --p2: #b69bff; --p3: #ffb562; --p4: #5bd68f; --p5: #7fb2ff; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #15132f; --sheet: #201d45; --ink: #efedff; --muted: #a9a6d0; --line: #3a3668;
  --accent: #ff77a8; --twin: #48d1dc; --good: #5bd68f; --bad: #ff8a80; --on-accent: #23102a;
  --p0: #ff77a8; --p1: #48d1dc; --p2: #b69bff; --p3: #ffb562; --p4: #5bd68f; --p5: #7fb2ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 56px; }
.wrap { max-width: 1020px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.brand { font: 400 24px/1 var(--display); color: var(--accent); background: none; border: 0; padding: 0; }
.brand:hover { background: none; }

:focus-visible { outline: 3px solid var(--twin); outline-offset: 2px; }
input, select { font: 400 17px var(--body); color: var(--ink); background: var(--sheet); border: 2px solid var(--line); border-radius: 8px; padding: 9px 12px; max-width: 100%; }

.row.end { align-items: flex-end; }

.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: center; }

.ring-compare { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }

@media (max-width: 640px) { .levels { grid-template-columns: 1fr; } }
.level { text-align: left; display: flex; flex-direction: column; gap: 4px; background: var(--sheet); border-color: var(--line); padding: 12px 14px; }
.level:hover { border-color: var(--accent); background: var(--sheet); }
.level span { font-weight: 400; font-size: 15px; color: var(--muted); }

.card { background: var(--sheet); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { overflow-wrap: anywhere; }
.card .tag { font: 400 12px var(--mono); color: var(--muted); }
.card .row button { flex: 1 1 auto; padding: 8px 10px; font-size: 15px; }
.card.add { border: 2px dashed var(--line); background: transparent; justify-content: center; align-items: center; text-align: center; min-height: 240px; }
.roll-box { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.roll-box svg { display: block; width: 100%; min-width: 620px; height: auto; }
.lane-label, .tick-label { font: 400 10px var(--mono); fill: var(--muted); }
.lane-line { stroke: var(--line); stroke-width: .5; }
.tick-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.perf { fill: var(--line); }
.n-a { fill: var(--accent); } .n-b { fill: var(--twin); } .n-ghost { fill: var(--accent); opacity: .3; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.swatch { display: inline-block; width: 22px; height: 9px; border-radius: 3px; margin-right: 6px; }
.typer { background: var(--sheet); border: 2px solid var(--line); border-radius: 12px; padding: 20px; cursor: text; display: flex; flex-direction: column; gap: 12px; }
.typer:focus { outline: none; border-color: var(--accent); }
.phrase { font: 400 clamp(19px, 3.4vw, 26px)/1.5 var(--mono); overflow-wrap: anywhere; }
.phrase .todo { color: var(--muted); opacity: .75; }
.phrase .cur { border-bottom: 3px solid var(--accent); font-weight: 600; }
.typer.oops .cur { color: var(--bad); border-color: var(--bad); }

@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.typer-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.typer:focus .blur-note { display: none; }
.blur-note { color: var(--accent); font-weight: 700; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; font: 600 13px var(--mono); }
.dot { padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--muted); }
.dot.on { border-color: var(--accent); color: var(--accent); }
.dot.ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.split { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } .split .ring { max-width: 320px; margin: 0 auto; width: 100%; } }
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.trait { background: var(--sheet); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.trait b { font: 400 25px/1.1 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.verdict { font: 400 clamp(44px, 9vw, 76px)/1 var(--display); margin: 0; animation: pop .28s ease-out; }
@keyframes pop { from { transform: scale(.9); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .verdict, .typer.oops { animation: none; } }
.v-good { color: var(--good); } .v-bad { color: var(--bad); }
.result { border-top: 2px solid var(--ink); padding-top: 16px; }
.gauge svg { display: block; width: 100%; height: auto; }
.g-a { fill: var(--good); } .g-b { fill: var(--bad); } .g-mark { fill: var(--ink); } .g-thr { stroke: var(--ink); stroke-width: 2; }
.g-text { font: 400 12px var(--mono); fill: var(--muted); } .g-val { font: 600 13px var(--mono); fill: var(--ink); }
ul.tells { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.table-box { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
th, td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.hit { color: var(--bad); font-weight: 700; } td.safe { color: var(--good); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .board { grid-template-columns: 1fr; } }
.chart svg { display: block; width: 100%; height: auto; }
.c-axis { stroke: var(--line); } .c-limit { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; }
.c-text { font: 400 11px var(--mono); fill: var(--muted); }
.c-own { fill: var(--twin); } .c-attack { fill: var(--accent); } .c-replay { fill: var(--ink); }
details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 700; }
details .stack { margin-top: 10px; }
.notice { border: 2px solid var(--accent); border-radius: 10px; padding: 10px 14px; }
</style>

<div class="wrap">
  <header>
    <button class="brand" id="home" aria-label="Typing Twin home">Typing Twin</button>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app" class="stack" style="gap:24px"></main>
</div>

<script>
const LEVELS = {
  word: { name: "One word", blurb: "Quick and brutal. About 45 seconds each.", phrase: "nukiae", rounds: 9 },
  sentence: { name: "A sentence", blurb: "The best party mode. About a minute each.", phrase: "quiet rhythm hides in every small habit of your hands", rounds: 5 },
  long: { name: "A long line", blurb: "More to measure, more to fake. About 2 minutes each.", phrase: "every keyboard keeps a quiet record of the hands that use it and those records are surprisingly hard to fake", rounds: 4 }
};
const MAX_FLIGHT = 2000;
const QWERTY = "qwertyuiopasdfghjklzxcvbnm ";
const label = c => c === " " ? "space" : c;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

const S = { view: "intro", level: null, players: [], attempts: [], typingAs: null, target: null, mode: "attack", enrollName: "", enrollRuns: [], run: null, last: null, replaying: 0, justAdded: null, confirmNew: false, nextColor: 0 };
const phrase = () => LEVELS[S.level].phrase;
const lanes = p => [...QWERTY].filter(c => p.includes(c));

/* ---------- Scoring ---------- */
function features(run) {
  const groups = new Map();
  const add = (k, v) => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(v); };
  run.keys.forEach((r, i) => {
    if (r.up !== null && r.up >= r.down) add("h:" + r.ch, r.up - r.down);
    if (i > 0 && !r.afterError) {
      const gap = r.down - run.keys[i - 1].down;
      if (gap >= 0 && gap <= MAX_FLIGHT) add("f:" + run.keys[i - 1].ch + r.ch, gap);
    }
  });
  const out = new Map();
  groups.forEach((v, k) => out.set(k, v.reduce((a, b) => a + b, 0) / v.length));
  return out;
}
const duration = run => run.keys[run.keys.length - 1].down - run.keys[0].down;
function buildProfile(runs) {
  const stats = new Map();
  runs.forEach(run => features(run).forEach((v, k) => {
    const s = stats.get(k) || { n: 0, mean: 0, m2: 0 };
    s.n += 1;
    const d = v - s.mean;
    s.mean += d / s.n;
    s.m2 += d * (v - s.mean);
    stats.set(k, s);
  }));
  return stats;
}
function spread(s) {
  const sd = s.n > 1 ? Math.sqrt(s.m2 / (s.n - 1)) : 0;
  return Math.max(sd, 12, 0.12 * s.mean);
}
function minFeatures(profile) { return Math.min(20, Math.floor(profile.size * 0.7)); }
function score(run, profile) {
  const parts = [];
  features(run).forEach((v, k) => {
    const s = profile.get(k);
    if (!s || s.n < 2) return;
    parts.push({ k, z: Math.abs(v - s.mean) / spread(s), diff: v - s.mean });
  });
  if (parts.length < minFeatures(profile)) return { distance: null, compared: parts.length, parts };
  return { distance: parts.reduce((a, p) => a + p.z, 0) / parts.length, compared: parts.length, parts };
}
function calibrate(runs) {
  const held = runs.map((r, i) => score(r, buildProfile(runs.filter((_, j) => j !== i))).distance).filter(d => d !== null);
  if (!held.length) return 2;
  return Math.min(3.5, Math.max(1.3, Math.max(...held) * 1.2));
}
function median(a) { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; }
const usualDuration = p => p.runs.map(duration).reduce((a, b) => a + b, 0) / p.runs.length;

/* ---------- Players ---------- */
function makePlayer(name, runs, sample) {
  const profile = buildProfile(runs);
  const player = { id: S.players.length + "-" + name, name, runs, profile, threshold: calibrate(runs), sample, color: S.nextColor++ % 6 };
  player.notes = medianNotes(runs);
  return player;
}
function medianNotes(runs) {
  const len = runs[0].keys.length;
  let t = 0;
  const notes = [];
  for (let i = 0; i < len; i++) {
    if (i > 0) t += median(runs.map(r => r.keys[i].down - r.keys[i - 1].down));
    notes.push({ ch: runs[0].keys[i].ch, start: t, dur: median(runs.map(r => r.keys[i].up !== null ? r.keys[i].up - r.keys[i].down : 70)) });
  }
  return notes;
}
function notesFromRun(run) {
  const t0 = run.keys.length ? run.keys[0].down : 0;
  return run.keys.map(r => ({ ch: r.ch, start: r.down - t0, dur: r.up !== null ? r.up - r.down : 70 }));
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function sampleRuns(text, seed, speed, count) {
  let state = hash(seed) % 2147483646 + 1;
  const rnd = () => (state = (state * 16807) % 2147483647) / 2147483647;
  const unit = key => (hash(seed + "|" + key) % 1000) / 1000;
  const runs = [];
  for (let r = 0; r < count; r++) {
    let t = 0;
    const keys = [];
    [...text].forEach((ch, i) => {
      if (i > 0) t += speed * (70 + 170 * unit(text[i - 1] + ch)) * (0.9 + rnd() * 0.2);
      const hold = (55 + 60 * unit(ch)) * (0.9 + rnd() * 0.2);
      keys.push({ ch, down: t, up: t + hold, afterError: false });
    });
    runs.push({ keys });
  }
  return runs;
}
const SAMPLES = [["Sample: Quick Fingers", 0.72], ["Sample: Steady Hands", 1.05], ["Sample: Two-Finger Typist", 1.4]];
function addSamples() {
  SAMPLES.forEach(([n, sp]) => S.players.push(makePlayer(n, sampleRuns(phrase(), n, sp, 6), true)));
}
const byId = id => S.players.find(p => p.id === id);
const humans = () => S.players.filter(p => !p.sample);

/* ---------- Signature ring ---------- */
function ringPoints(notes) {
  // Each key gets a fixed angle. Radius shows that key's gap compared with this typist's own median gap.
  const gaps = notes.map((n, i) => i === 0 ? null : n.start - notes[i - 1].start);
  const med = median(gaps.filter(g => g !== null)) || 1;
  const holdMed = median(notes.map(n => n.dur)) || 1;
  const N = notes.length, cx = 120, cy = 120, base = 44, scale = 40;
  return notes.map((n, i) => {
    const g = gaps[i] === null ? 1 : Math.min(2.6, gaps[i] / med);
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
    const r = base + g * scale;
    const h = Math.min(2.2, n.dur / holdMed);
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, a, h };
  });
}
function smoothPath(pts) {
  const n = pts.length;
  let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6, c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d + "Z";
}
function ringSVG(notes, color, compareNotes, name) {
  const pts = ringPoints(notes);
  const col = `var(--p${color})`;
  let g = `<circle class="ring-guide" cx="120" cy="120" r="84"/>`;
  pts.forEach(p => {
    const r1 = 22, r2 = r1 + p.h * 10;
    g += `<line class="ring-tick" stroke="${col}" x1="${(120 + Math.cos(p.a) * r1).toFixed(1)}" y1="${(120 + Math.sin(p.a) * r1).toFixed(1)}" x2="${(120 + Math.cos(p.a) * r2).toFixed(1)}" y2="${(120 + Math.sin(p.a) * r2).toFixed(1)}"/>`;
  });
  const d = smoothPath(pts);
  g += `<path class="ring-fill" fill="${col}" d="${d}"/><path class="ring-line" stroke="${col}" d="${d}"/>`;
  if (compareNotes) g += `<path class="ring-compare" d="${smoothPath(ringPoints(compareNotes))}"/>`;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Typing signature${name ? " for " + esc(name) : ""}. The outer shape shows the gap before each key, and the inner marks show how long each key is held.">${g}</svg>`;
}

/* ---------- Roll ---------- */
function rollSVG(text, layers, minEnd) {
  const L_ = lanes(text);
  const W = 760, L = 44, top = 16, laneH = 13, H = top + L_.length * laneH + 28;
  const end = Math.max(minEnd || 0, 1000, ...layers.flatMap(l => l.notes.map(n => n.start + n.dur))) * 1.03;
  const x = ms => L + (ms / end) * (W - L - 10);
  const step = [500, 1000, 2000, 5000, 10000, 20000, 60000].find(s => end / s <= 10) || 120000;
  let g = "";
  for (let i = 8; i < W; i += 14) g += `<circle class="perf" cx="${i}" cy="6" r="2.5"/>`;
  L_.forEach((c, i) => {
    const y = top + i * laneH;
    g += `<line class="lane-line" x1="${L}" x2="${W - 10}" y1="${y + laneH}" y2="${y + laneH}"/><text class="lane-label" x="${L - 6}" y="${y + 10}" text-anchor="end">${label(c)}</text>`;
  });
  const base = top + L_.length * laneH;
  for (let t = 0; t <= end; t += step) g += `<line class="tick-line" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${base}"/><text class="tick-label" x="${x(t)}" y="${base + 15}" text-anchor="middle">${t / 1000}s</text>`;
  layers.forEach(l => l.notes.forEach(n => {
    const i = L_.indexOf(n.ch);
    if (i < 0) return;
    const y = top + i * laneH + (l.inset ? 4 : 2), h = laneH - (l.inset ? 8 : 4);
    g += `<rect class="${l.cls}" x="${x(n.start).toFixed(1)}" y="${y}" width="${Math.max(3, x(n.start + n.dur) - x(n.start)).toFixed(1)}" height="${h}" rx="2"/>`;
  }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Piano roll. Each row is a key, and each bar shows when it was pressed and how long it was held.">${g}</svg>`;
}

/* ---------- Typing ---------- */
function startRun() {
  S.run = { idx: 0, keys: [], errors: 0, pendingError: false, held: {}, finished: false };
  drawTyper();
  const t = $("typer"); if (t) t.focus({ preventScroll: true });
}
function canType() {
  const t = $("typer");
  return S.run && !S.run.finished && !S.replaying && t && document.activeElement === t;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.run && $("typer") && !S.replaying) { e.preventDefault(); startRun(); return; }
  if (!canType() || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  e.preventDefault();
  if (e.repeat) return;
  const r = S.run, text = phrase(), expected = text[r.idx];
  if (e.key.toLowerCase() === expected) {
    const rec = { ch: expected, down: e.timeStamp, up: null, afterError: r.pendingError };
    r.keys.push(rec);

/* ---------- Judging ---------- */
function judge(run, typist, target, mode) {
  const res = score(run, target.profile), d = res.distance, thr = target.threshold;
  const paceRatio = duration(run) / usualDuration(target);
  const who = typist ? typist.name : "Guest";
  let v;
  if (d === null) v = { good: false, word: "Too messy", text: "Too many wrong keys broke up the rhythm. Try the line again.", counted: false };
  else if (mode === "self") v = d <= thr
    ? { good: true, word: "That's you", text: "This line sits inside your own rhythm range.", counted: true, pass: true }
    : { good: false, word: "Who are you?", text: "It didn't recognize its own typist. That's a false rejection.", counted: true, pass: false };
  else if (mode === "disguise") {
    const paceOk = paceRatio >= 0.85 && paceRatio <= 1.15;
    if (!paceOk) v = { good: false, word: paceRatio < 1 ? "Too fast" : "Too slow", text: `Your pace was ${Math.abs(Math.round((paceRatio - 1) * 100))}% off. Disguises must stay within 15% of your usual pace.`, counted: false };
    else v = d > thr
      ? { good: true, word: "Disguised!", text: "You kept your pace and still fooled it.", counted: true, pass: false }
      : { good: false, word: "Still you", text: "It saw through the disguise. Try changing which keys you linger on.", counted: true, pass: true };
  }
  else if (mode === "replay") v = d <= thr
    ? { good: false, word: "Replay wins", text: "A recording of real timing passes, because the rhythm really is theirs. That's why typing rhythm can't be the only thing protecting a login.", counted: true, pass: true }
    : { good: true, word: "Replay failed", text: "This replay fell outside the limit.", counted: true, pass: false };
  else v = d <= thr
    ? { good: false, word: "Fooled it!", text: `${esc(who)} passed as ${esc(target.name)}. That's a false acceptance.`, counted: true, pass: true }
    : { good: true, word: "Caught!", text: `It could tell ${esc(who)} isn't ${esc(target.name)}.`, counted: true, pass: false };
  S.last = { run, res, v, target, mode, who, paceRatio };
  S.attempts.push({ n: S.attempts.length + 1, who, typistId: typist ? typist.id : "guest", targetId: target.id, target: target.name, mode, d, thr, ratio: d === null ? null : d / thr, word: v.word, counted: v.counted, pass: v.pass });

}
function buzz(win) {

      g.gain.exponentialRampToValueAtTime(0.12, t0 + i * .1 + .01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * .1 + .16);
      o.connect(g).connect(ctx.destination);

}

      g.gain.exponentialRampToValueAtTime(0.0001, b + 0.05);

    return `<li>The gap from <b>${label(p.k[2])}</b> to <b>${label(p.k[3])}</b> was ${ms} ms ${dir} than the profile</li>`;

/* ---------- Replay ---------- */
function runReplay() {
  const target = byId(S.target);
  const source = target.runs[target.runs.length - 1];
  const token = ++S.replaying;
  S.mode = "replay";
  S.last = null;
  render();
  S.run = { idx: 0, keys: [], errors: 0, pendingError: false, held: {}, finished: true };
  const t0 = source.keys[0].down;
  source.keys.forEach((k, i) => setTimeout(() => {
    if (S.replaying !== token || S.view !== "attack") return;
    S.run.keys.push({ ch: k.ch, down: k.down - t0, up: k.up === null ? null : k.up - t0, afterError: false });
    S.run.idx = i + 1;
    drawTyper();
    if (i === source.keys.length - 1) setTimeout(() => {
      if (S.replaying !== token || S.view !== "attack") return;
      judge(S.run, null, target, "replay");
      const a = S.attempts[S.attempts.length - 1]; a.who = "Replay bot"; a.typistId = "replay";
      S.replaying = 0;
      S.mode = "attack";
      render();
      startRun();
    }, 300);
  }, k.down - t0));
}

    <div class="legend"><span><svg width="14" height="14" style="vertical-align:-2px"><path class="c-attack" d="M7 1 L13 13 L1 13 Z"/></svg> Attack</span><span><svg width="14" height="14" style="vertical-align:-2px"><circle class="c-own" cx="7" cy="7" r="6"/></svg> Own typing</span><span><svg width="14" height="14" style="vertical-align:-2px"><rect class="c-replay" x="2" y="2" width="10" height="10"/></svg> Replay</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of ${pts.length} attempts, each shown as distance relative to the target's limit.">${g}</svg></div></section>`;
  const rows = [...S.attempts].reverse().slice(0, 12).map(a => `<tr><td>${esc(a.who)}</td><td>${esc(a.target)}</td><td>${{ attack: "Attack", self: "Own typing", disguise: "Disguise", replay: "Replay" }[a.mode]}</td><td>${a.ratio === null ? "n/a" : a.ratio.toFixed(2) + "×"}</td><td>${esc(a.word)}</td></tr>`).join("");
  return `<section class="stack"><h2>Scores</h2><p class="muted">From this party only. A few attempts make a fun scoreboard, not a measure of accuracy.</p></section>
    ${board}${chart}${matrix}
    <section class="stack"><h3>Latest attempts</h3><div class="table-box"><table><thead><tr><th>Typing</th><th>Target</th><th>Type</th><th>Distance</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function howView() {
  return `<section class="stack">
    <h2>How it works</h2>
    <p>The detector measures two things: how long each key is held, and the time from one key going down to the next. For each timing, it works out how far your line is from a player's profile, measured in that timing's usual variation. The average is the distance. This method is called scaled Manhattan distance.</p>
    <p>Each player's limit comes from testing each of their training lines against the others. Below the limit, the typing passes as them.</p>
    <p>Reading a signature: the shape is scaled to each typist's own median gap, so it shows their relative rhythm and not simply their speed. Signatures can look alike, and a distinctive shape doesn't prove anyone is unique.</p>
    <p>This is a game, not security. A few lines of typing aren't enough to protect anything, and a replay shows why rhythm can't be the only check.</p>
    <details><summary>What's in this mockup</summary><div class="stack"><p class="small">The sample players are simulated. Real players are scored in this page, not on the backend. Nothing is stored after a refresh.</p></div></details>
  </section>`;
}
function renderTabs() {
  if (!S.level || S.view === "enroll" || S.view === "name" && !S.players.length) { $("tabs").innerHTML = ""; return; }
  const cur = S.view === "scores" ? "scores" : S.view === "how" ? "how" : "room";
  $("tabs").innerHTML = [["room", "Room"], ["scores", "Scores"], ["how", "How it works"]].map(([k, l]) => `<button data-tab="${k}"${cur === k ? ' aria-current="page"' : ""}>${l}</button>`).join("");
}
function render() {
  renderTabs();
  const v = { intro: introView, name: nameView, enroll: enrollView, reveal: revealView, room: roomView, attack: attackView, scores: scoresView, how: howView }[S.view];
  $("app").innerHTML = v();
  if ($("typer")) drawTyper();
  if (S.view === "name" && $("player-name")) $("player-name").focus();
}
function go(view) { S.replaying = 0; S.run = null; S.view = view; render(); }
function openAttack(targetId, mode) {
  S.target = targetId; S.mode = mode; S.last = null; S.replaying = 0;
  S.view = "attack"; render(); startRun();
}
document.addEventListener("submit", e => {
  if (e.target.id !== "name-form") return;
  e.preventDefault();
  const name = $("player-name").value.trim();
  if (!name) return;
  S.enrollName = name; S.enrollRuns = [];
  S.view = "enroll"; render(); startRun();
});
document.addEventListener("change", e => {
  if (e.target.id === "who" || e.target.id === "tgt") {
    if (e.target.id === "who") S.typingAs = e.target.value || null;
    else S.target = e.target.value;
    const same = S.typingAs && S.typingAs === S.target;
    S.mode = same ? (S.mode === "disguise" ? "disguise" : "self") : "attack";
    S.last = null; S.replaying = 0; render(); startRun();
  }
});
document.addEventListener("click", e => {
  if (e.target.closest("#typer")) { const t = $("typer"); if (t) t.focus({ preventScroll: true }); return; }
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "home") { if (S.level) go("room"); return; }
  if (b.dataset.level) { S.level = b.dataset.level; addSamples(); go("name"); return; }
  if (b.dataset.tab) { go(b.dataset.tab); return; }
  if (b.dataset.attack) { if (S.typingAs === b.dataset.attack) S.typingAs = null; openAttack(b.dataset.attack, "attack"); return; }
  if (b.dataset.self) { S.typingAs = b.dataset.self; openAttack(b.dataset.self, "self"); return; }
  if (b.id === "to-room") { go("room"); return; }
  if (b.id === "add-player") { go("name"); return; }
  if (b.id === "restart") { if (!S.replaying) startRun(); return; }
  if (b.id === "replay") { runReplay(); return; }
  if (b.id === "m-self") { S.mode = "self"; S.last = null; render(); startRun(); return; }
  if (b.id === "m-disguise") { S.mode = "disguise"; S.last = null; render(); startRun(); return; }
  if (b.id === "hear") { playNotes(byId(b.dataset.id).notes); return; }
  if (b.id === "cancel-new") { S.confirmNew = false; render(); return; }
  if (b.id === "new-party") {
    if (!S.confirmNew) { S.confirmNew = true; render(); return; }
    Object.assign(S, { view: "intro", level: null, players: [], attempts: [], typingAs: null, target: null, mode: "attack", enrollName: "", enrollRuns: [], run: null, last: null, replaying: 0, justAdded: null, confirmNew: false, nextColor: 0 });
    render();
  }
});
render();
</script>
