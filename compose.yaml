services:
  # The default stack: public mode, no database at all. `docker
  # compose up --build` opens Typing Twin Party at http://localhost:8000/
  # with nothing else running -- see PARTY_LAUNCH_PLAN.md Part 1.
  # For the account system too, layer compose.accounts.yaml on top
  # (see README.md's Quick start).
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: ${DEBUG:-true}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://127.0.0.1:8000}
      ENABLE_ACCOUNTS: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
