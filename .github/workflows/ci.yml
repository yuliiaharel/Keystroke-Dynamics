name: CI

on:
  push:
    branches: [master, modernize]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keystroke
          POSTGRES_PASSWORD: keystroke
          POSTGRES_DB: keystroke_dynamics_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group evaluation

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default stack: public mode, no Postgres. Must open Party
      # at "/" -- see PARTY_LAUNCH_PLAN.md Part 1.
      - name: Build and start the default (public-mode) stack
        run: docker compose up --build -d --wait

      - name: Health check
        run: curl --fail http://127.0.0.1:8000/health

      - name: Party is served at "/"
        run: curl --fail http://127.0.0.1:8000/ | grep -q 'static/js/party.js'

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down the public-mode stack
        if: always()
        run: docker compose down -v

      # The documented accounts-on variant -- compose.accounts.yaml
      # layers Postgres + the account system on top.
      - name: Build and start the accounts-on stack
        run: docker compose -f compose.yaml -f compose.accounts.yaml up --build -d --wait

      - name: Health check (accounts-on)
        run: curl --fail http://127.0.0.1:8000/health

      - name: Account home page and Party both served
        run: |
          curl --fail http://127.0.0.1:8000/ | grep -q 'Keystroke Dynamics'
          curl --fail http://127.0.0.1:8000/party | grep -q 'static/js/party.js'

      - name: Compose logs (accounts-on, on failure)
        if: failure()
        run: docker compose -f compose.yaml -f compose.accounts.yaml logs

      - name: Tear down the accounts-on stack
        if: always()
        run: docker compose -f compose.yaml -f compose.accounts.yaml down -v
